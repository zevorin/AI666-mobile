<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0e">
  <title>编辑个人资料 - 多元拾光</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/duoyuan-shiguang-favicon.svg">
  <link rel="stylesheet" href="./mobile-h5.css?v=20260831-profile-avatar-flat-v1">
  <script src="./mobile-h5.js?v=20260830-profile-cell-edit-v1" defer></script>
</head>
<body class="mobile-h5-body" data-mobile-page="profile-edit">
  <div class="mobile-shell">
    <header class="mobile-topbar mobile-topbar-detail" data-mobile-appbar>
      <button class="mobile-back-button" type="button" data-mobile-back data-fallback="./mobile-my.html" aria-label="返回我的"><img class="mobile-icon" src="../../resources/icons/remixicon/svg/Arrows/arrow-left-s-line.svg" alt=""></button>
      <h1 class="mobile-page-title">编辑个人资料</h1><span class="mobile-topbar-placeholder" aria-hidden="true"></span>
    </header>
    <main id="main" class="mobile-task-content mobile-profile-edit-content">
      <section class="mobile-avatar-edit" aria-label="头像设置">
        <img src="../../assets/web/image_assets/nav-avatar-ai-creator-v1.webp" alt="拾光创作者头像">
        <button type="button" data-mobile-toast-message="请选择新的头像">更换头像</button>
      </section>

      <nav class="mobile-profile-cell-list" aria-label="个人资料字段">
        <a class="mobile-profile-cell" href="./mobile-profile-field-edit.html?field=nickname" data-mobile-profile-cell="nickname">
          <span class="mobile-profile-cell-copy"><strong>昵称</strong><small data-mobile-profile-value>拾光创作者</small></span>
          <img class="mobile-profile-cell-arrow" src="../../resources/icons/remixicon/svg/Arrows/arrow-right-s-line.svg" alt="">
        </a>
        <a class="mobile-profile-cell" href="./mobile-profile-field-edit.html?field=bio" data-mobile-profile-cell="bio">
          <span class="mobile-profile-cell-copy"><strong>个人简介</strong><small data-mobile-profile-value>用 AI 记录每一次灵感。</small></span>
          <img class="mobile-profile-cell-arrow" src="../../resources/icons/remixicon/svg/Arrows/arrow-right-s-line.svg" alt="">
        </a>
        <a class="mobile-profile-cell" href="./mobile-profile-field-edit.html?field=phone" data-mobile-profile-cell="phone">
          <span class="mobile-profile-cell-copy"><strong>手机号</strong><small data-mobile-profile-value>138****5678</small></span>
          <img class="mobile-profile-cell-arrow" src="../../resources/icons/remixicon/svg/Arrows/arrow-right-s-line.svg" alt="">
        </a>
        <a class="mobile-profile-cell" href="./mobile-profile-field-edit.html?field=wechat" data-mobile-profile-cell="wechat">
          <span class="mobile-profile-cell-copy"><strong>微信号</strong><small data-mobile-profile-value>微信账号</small></span>
          <img class="mobile-profile-cell-arrow" src="../../resources/icons/remixicon/svg/Arrows/arrow-right-s-line.svg" alt="">
        </a>
      </nav>
    </main>
  </div>
  <button class="mobile-walkthrough-trigger" type="button" data-mobile-walkthrough-open data-mobile-walkthrough-review-only aria-controls="mobile-walkthrough">走查</button>
  <aside id="mobile-walkthrough" class="mobile-walkthrough" data-mobile-walkthrough aria-hidden="true"><div class="mobile-walkthrough-head"><h2>资料编辑走查规则</h2><button class="mobile-icon-button" type="button" data-mobile-walkthrough-close aria-label="关闭走查规则"><img class="mobile-icon" src="../../resources/icons/remixicon/svg/System/close-line.svg" alt=""></button></div><div class="mobile-rule-grid"><section class="mobile-rule-card"><strong>页面目的</strong><p>承接个人中心的资料编辑动作，并同步呈现与 Web 端一致的账号信息状态。</p></section><section class="mobile-rule-card"><strong>资料状态</strong><p>昵称、简介与头像沿用同一账号资料；每个资料项进入独立页面保存。</p></section><section class="mobile-rule-card"><strong>账号信息</strong><p>手机号和微信状态与 Web 端账号资料同源；手机号始终脱敏，相关变更进入对应账号验证流程。</p></section><section class="mobile-rule-card"><strong>验收</strong><p>四个资料项样式一致且均可进入编辑页；保存后返回本页并刷新对应内容；手机号无完整明文；返回不进入 PC 页面。</p></section></div></aside>
  <div class="mobile-toast" data-mobile-toast role="status" aria-live="polite"></div>
</body>
</html>
