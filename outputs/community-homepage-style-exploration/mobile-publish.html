<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>直接发布 - 多元拾光</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/duoyuan-shiguang-favicon.svg">
  <link rel="stylesheet" href="./mobile-h5.css?v=20260901-publish-form-simplified-v3">
  <script src="./mobile-h5.js?v=20260901-publish-form-simplified-v3" defer></script>
</head>
<body class="mobile-h5-body" data-mobile-page="publish">
  <div class="mobile-shell mobile-direct-publish-page has-action-bar">
    <header class="mobile-topbar mobile-topbar-detail mobile-direct-publish-topbar" data-mobile-appbar>
      <button class="mobile-back-button" type="button" data-mobile-back data-fallback="./mobile-home.html" aria-label="返回上一页"><img class="mobile-icon" src="../../resources/icons/remixicon/svg/Arrows/arrow-left-s-line.svg" alt=""></button>
      <h1 class="mobile-page-title">直接发布</h1>
      <span class="mobile-topbar-placeholder" aria-hidden="true"></span>
    </header>

    <main id="main" class="mobile-direct-publish-content">
      <form id="mobile-direct-publish-form" class="mobile-direct-publish-form" data-mobile-direct-publish-form novalidate>
        <section class="mobile-direct-publish-section" aria-labelledby="mobile-direct-publish-media-title">
          <div class="mobile-flash-page-section-head">
            <div><h2 id="mobile-direct-publish-media-title">媒体文件</h2><p>支持图片与视频</p></div>
            <span>必填</span>
          </div>
          <input id="mobile-direct-publish-file" class="mobile-visually-hidden" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm,video/quicktime" required data-mobile-direct-publish-input>
          <button class="mobile-flash-page-media-add mobile-direct-publish-media-add" type="button" data-mobile-direct-publish-media-open>
            <span class="mobile-flash-page-media-add-icon" aria-hidden="true"><img class="mobile-icon" src="../../resources/icons/remixicon/svg/System/upload-2-line.svg" alt=""></span>
            <span class="mobile-flash-page-media-add-copy"><strong data-mobile-direct-publish-label>选择图片或视频</strong><small data-mobile-direct-publish-file-name>JPG、PNG、WebP、MP4、WebM、MOV</small></span>
          </button>
          <figure class="mobile-direct-publish-preview" data-mobile-direct-publish-preview hidden>
            <img data-mobile-direct-publish-image-preview alt="已选择的图片作品预览" hidden>
            <video data-mobile-direct-publish-video-preview controls playsinline preload="metadata" hidden></video>
          </figure>
        </section>

        <div class="mobile-direct-publish-fields">
          <label class="mobile-field" for="mobile-direct-publish-work-title"><span>标题 <em>必填</em></span><input id="mobile-direct-publish-work-title" type="text" maxlength="40" placeholder="填写作品标题" required data-mobile-direct-publish-work-title><small>最多 40 个字</small></label>
          <label class="mobile-field" for="mobile-direct-publish-description"><span>简介 <em>选填</em></span><textarea id="mobile-direct-publish-description" maxlength="600" rows="4" placeholder="介绍创作想法、创作场景或使用模型" data-mobile-direct-publish-description></textarea><small>最多 600 个字</small></label>
          <label class="mobile-field" for="mobile-direct-publish-prompt"><span>提示词 <em>必填</em></span><textarea id="mobile-direct-publish-prompt" maxlength="1000" rows="5" placeholder="填写生成该作品使用的提示词" required data-mobile-direct-publish-prompt></textarea><small>最多 1000 个字</small></label>
        </div>
        <p id="mobile-direct-publish-status" class="mobile-flash-page-status mobile-direct-publish-status" role="status" aria-live="polite" data-mobile-direct-publish-status>请选择图片或视频</p>

        <footer class="mobile-action-bar mobile-flash-page-action mobile-direct-publish-action">
          <button class="mobile-action-primary" type="submit" data-mobile-direct-publish-submit disabled>
            <span class="mobile-flash-page-submit-copy"><strong data-mobile-direct-publish-submit-label>发布作品</strong><img class="mobile-icon" src="../../resources/icons/remixicon/svg/Arrows/arrow-up-line.svg" alt=""></span>
          </button>
        </footer>
      </form>
    </main>
  </div>
  <div class="mobile-toast" data-mobile-toast role="status" aria-live="polite"></div>
</body>
</html>
