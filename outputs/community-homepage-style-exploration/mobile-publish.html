<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>直接发布 - 多元拾光</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/duoyuan-shiguang-favicon.svg">
  <link rel="stylesheet" href="./mobile-h5.css?v=20260902-publish-status-v32">
  <script src="./mobile-h5.js?v=20260902-publish-status-v33" defer></script>
</head>
<body class="mobile-h5-body" data-mobile-page="publish">
  <div class="mobile-shell mobile-direct-publish-page has-action-bar">
    <header class="mobile-topbar mobile-topbar-detail mobile-direct-publish-topbar" data-mobile-appbar>
      <button class="mobile-back-button" type="button" data-mobile-back data-fallback="./mobile-home.html" aria-label="返回上一页"><img class="mobile-icon" src="../../resources/icons/remixicon/svg/Arrows/arrow-left-s-line.svg" alt=""></button>
      <h1 class="mobile-page-title">直接发布</h1>
      <span class="mobile-topbar-placeholder" aria-hidden="true"></span>
    </header>

    <main id="main" class="mobile-direct-publish-content">
      <form id="mobile-direct-publish-form" class="mobile-direct-publish-form" data-mobile-direct-publish-form novalidate>
        <section class="mobile-direct-publish-section" aria-labelledby="mobile-direct-publish-media-title">
          <nav class="mobile-direct-publish-media-mode" aria-label="发布类型">
            <div class="mobile-filter-tabs mobile-home-filter-tabs mobile-direct-publish-media-tabs mobile-tabs-style-a" role="tablist" aria-label="媒体类型">
              <button class="mobile-filter-tab mobile-home-filter-tab is-active" type="button" role="tab" aria-selected="true" aria-pressed="true" data-mobile-direct-publish-media-tab="image">发布图片</button>
              <button class="mobile-filter-tab mobile-home-filter-tab" type="button" role="tab" aria-selected="false" aria-pressed="false" tabindex="-1" data-mobile-direct-publish-media-tab="video">发布视频</button>
            </div>
          </nav>
          <div class="mobile-flash-page-section-head mobile-direct-publish-media-head">
            <div><h2 id="mobile-direct-publish-media-title">媒体文件 <em>*</em></h2><p data-mobile-direct-publish-media-help>第一张为封面，拖动可调整顺序</p></div>
          </div>
          <input id="mobile-direct-publish-file" class="mobile-visually-hidden" type="file" accept="image/png,image/jpeg,image/webp" aria-label="选择图片" required multiple data-mobile-direct-publish-input>
          <div class="mobile-direct-publish-media-grid">
            <button class="mobile-create-reference-add mobile-direct-publish-media-add mobile-unified-upload-button" type="button" aria-label="添加图片" data-mobile-direct-publish-media-open>
              <img class="mobile-icon" src="./assets/mobile/upload-unified-v1.svg" alt="" data-mobile-direct-publish-media-icon>
            </button>
            <span class="mobile-direct-publish-media-count" aria-live="polite" data-mobile-direct-publish-media-count>0/4</span>
            <div class="mobile-direct-publish-preview-list" data-mobile-direct-publish-preview-list aria-live="polite" hidden></div>
          </div>
        </section>

        <div class="mobile-direct-publish-fields">
          <label class="mobile-field" for="mobile-direct-publish-work-title"><span>标题 <em>*</em></span><input id="mobile-direct-publish-work-title" type="text" maxlength="40" placeholder="填写作品标题" required data-mobile-direct-publish-work-title><small data-mobile-direct-publish-counter-for="mobile-direct-publish-work-title">0/40</small></label>
          <label class="mobile-field" for="mobile-direct-publish-description"><span>简介</span><textarea id="mobile-direct-publish-description" maxlength="600" rows="4" placeholder="介绍创作想法、创作场景或使用模型" data-mobile-direct-publish-description></textarea><small data-mobile-direct-publish-counter-for="mobile-direct-publish-description">0/600</small></label>
          <label class="mobile-field" for="mobile-direct-publish-prompt"><span>提示词 <em>*</em></span><textarea id="mobile-direct-publish-prompt" maxlength="1000" rows="5" placeholder="填写生成该作品使用的提示词" required data-mobile-direct-publish-prompt></textarea><small data-mobile-direct-publish-counter-for="mobile-direct-publish-prompt">0/1000</small></label>
        </div>
        <p id="mobile-direct-publish-status" class="mobile-flash-page-status mobile-direct-publish-status" role="status" aria-live="polite" data-mobile-direct-publish-status></p>

        <footer class="mobile-action-bar mobile-flash-page-action mobile-direct-publish-action">
          <button class="mobile-action-primary" type="submit" data-mobile-direct-publish-submit disabled>
            <span class="mobile-flash-page-submit-copy"><strong data-mobile-direct-publish-submit-label>发布作品</strong><img class="mobile-icon" src="../../resources/icons/remixicon/svg/Arrows/arrow-up-line.svg" alt=""></span>
          </button>
        </footer>
      </form>
    </main>
  </div>
  <div class="mobile-toast" data-mobile-toast role="status" aria-live="polite"></div>
</body>
</html>
